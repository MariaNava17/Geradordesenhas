<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas</title>
</head>
<body>
    <section class="conteudo">
        <div class="conteudo-titulo">
            <img src="" alt="imagem de um cadeado">
            <h2 class="titulo-principal">Gerador de Senhas</h2>
            <h3 class="titulo-secundario">Gere senhas aleatorias</h3>
        </div>
        <div class="conteudo-senha">
            <label for="senha">Senhas</label>
            <input name="senha" type="text" id="campo-senha">
        </div>
        <div class="parametro">
            <h3 class="parametro-titulo">Personalize sua senha</h3>
            <div class="parametro-coluna__senha">
                <div class="parametro-senha">
                    <h4 class="prametro-senha__titulo">Numero de caracteres</h4>
                    <div class="parametro-senha-botoes">
                       <button class="parametro-senha__botoes">-</button>
                       <p class="parametro-senha__textos">12</p>
                       <button class="parametro-senha__botoes">+</button>
                    </div>
                </div>
                <div class="parametro-senha">
                    <h4 class="prametro-senha__titulo">Caracteristica da senha</h4>
                    <div class="parametro-senha-chackbox">
                        <label for=""></label>
                    </div>
                </div>
            </div>
        </div>
    </section>
   </body>
</html>
